buildscript {
    repositories {
        mavenCentral()
        maven {
            name = 'forge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.197'
    }
}

apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: 'net.minecraftforge.gradle'

version = mod_version
group = mod_group
archivesBaseName = mod_id

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

if (!JavaVersion.current().isJava8()) {
    throw new GradleException('EMC Fluid 1.12.2 must be built with JDK 8. Set JAVA_HOME before invoking Gradle.')
}

minecraft {
    mappings channel: 'stable', version: '39-1.12'

    runs {
        client {
            workingDirectory project.file('run-client')
            property 'forge.logging.console.level', 'info'
            property 'fml.coreMods.load', 'cn.gbk.emcfluid.dev.DevSideFixCoremod'
            jvmArg "-Djava.ext.dirs=${System.getProperty('java.home')}/lib/ext"
            jvmArg "-Djava.library.path=${file('build/natives').absolutePath}"
        }
        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.console.level', 'info'
            property 'fml.coreMods.load', 'cn.gbk.emcfluid.dev.DevSideFixCoremod'
            property 'emcfluid.dev.stageBProbe', 'true'
            property 'emcfluid.dev.stageCProbe', 'true'
            property 'emcfluid.dev.stageDProbe', 'true'
            property 'emcfluid.dev.stageFProbe', project.hasProperty('withRs') ? 'true' : 'false'
            property 'emcfluid.dev.stageGProbe', project.hasProperty('withAe2Fc') ? 'true' : 'false'
            property 'emcfluid.dev.stageHProbe', 'true'
            args 'nogui'
        }
    }
}

repositories {
    flatDir {
        name = 'localMods'
        dirs 'reference'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // ProjectE is mandatory. The other fixed-version integrations are compile-time
    // dependencies and are copied to run/mods only for their dedicated test matrix.
    compile files('reference/ProjectE-1.12.2-PE1.4.1.jar')
    compileOnly files('reference/refinedstorage-1.6.16.jar')
    compileOnly files('reference/appliedenergistics2-rv6-stable-7.jar')
    compileOnly files('reference/ae2fc-1.12.2-1.0.11.jar')
    compileOnly files('reference/jei_1.12.2-4.16.5.1029-api.jar')
}

// Compile only sources that have been migrated to the 1.12.2 API. The remaining
// 1.20.1 sources stay visible as migration inputs and are enabled by later stages.
sourceSets {
    main {
        java {
            include 'cn/gbk/emcfluid/EmcFluid.java'
            include 'cn/gbk/emcfluid/config/EmcFluidConfig.java'
            include 'cn/gbk/emcfluid/content/block/*.java'
            include 'cn/gbk/emcfluid/content/blockentity/*.java'
            include 'cn/gbk/emcfluid/content/menu/*.java'
            include 'cn/gbk/emcfluid/content/item/KnowledgePatternItem.java'
            include 'cn/gbk/emcfluid/content/recipe/KnowledgePatternUnbindRecipe.java'
            include 'cn/gbk/emcfluid/client/screen/*.java'
            include 'cn/gbk/emcfluid/data/TierConfigWorldData.java'
            include 'cn/gbk/emcfluid/dev/DevSideFixCoremod.java'
            include 'cn/gbk/emcfluid/dev/DevAccessTransformer.java'
            include 'cn/gbk/emcfluid/dev/StageCProbe.java'
            include 'cn/gbk/emcfluid/dev/StageDProbe.java'
            include 'cn/gbk/emcfluid/dev/StageFProbe.java'
            include 'cn/gbk/emcfluid/dev/StageGProbe.java'
            include 'cn/gbk/emcfluid/dev/StageHProbe.java'
            include 'cn/gbk/emcfluid/gui/ModGuiHandler.java'
            include 'cn/gbk/emcfluid/integration/*.java'
            include 'cn/gbk/emcfluid/integration/ae2/*.java'
            include 'cn/gbk/emcfluid/integration/jei/*.java'
            include 'cn/gbk/emcfluid/integration/rs/*.java'
            include 'cn/gbk/emcfluid/network/*.java'
            include 'cn/gbk/emcfluid/proxy/*.java'
            include 'cn/gbk/emcfluid/registry/ModContent.java'
            include 'cn/gbk/emcfluid/util/EmcFluidTierConfig.java'
            include 'cn/gbk/emcfluid/util/EmcFluidInput.java'
            include 'cn/gbk/emcfluid/util/EmcStackIdentity.java'
            include 'cn/gbk/emcfluid/util/EmcCraftingTarget.java'
            include 'cn/gbk/emcfluid/util/EmcCraftingTargets.java'
            include 'cn/gbk/emcfluid/util/CostResolver.java'
            include 'cn/gbk/emcfluid/util/KnowledgePatternData.java'
            include 'cn/gbk/emcfluid/util/KnowledgePatternSync.java'
            include 'cn/gbk/emcfluid/util/ProjectEAccess.java'
        }
        resources {
            include 'mcmod.info'
            include 'pack.mcmeta'
            include 'emcfluid.png'
            include 'META-INF/emcfluid_dev_at.cfg'
            include 'assets/emcfluid/blockstates/*.json'
            include 'assets/emcfluid/lang/*.lang'
            include 'assets/emcfluid/models/block/*.json'
            include 'assets/emcfluid/models/item/*.json'
            include 'assets/emcfluid/recipes/*.json'
            include 'assets/emcfluid/textures/**/*.png'
        }
    }
}

processResources {
    // LegacyDev discovers the development mod from the compiled-classes root.
    // Keep resources beside classes so FMLFileResourcePack can resolve them.
    destinationDir = compileJava.destinationDir
    inputs.property 'version', project.version
    inputs.property 'mcversion', minecraft_version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': minecraft_version
    }
    from(sourceSets.main.resources.srcDirs) {
        include 'META-INF/emcfluid_dev_at.cfg'
        include 'pack.mcmeta'
        include 'emcfluid.png'
        include 'assets/emcfluid/blockstates/*.json'
        include 'assets/emcfluid/lang/*.lang'
        include 'assets/emcfluid/models/block/*.json'
        include 'assets/emcfluid/models/item/*.json'
        include 'assets/emcfluid/recipes/*.json'
        include 'assets/emcfluid/textures/**/*.png'
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

jar {
    exclude 'cn/gbk/emcfluid/dev/**'
    exclude 'META-INF/emcfluid_dev_at.cfg'
    manifest {
        attributes(
                'Specification-Title': mod_id,
                'Specification-Vendor': mod_author,
                'Specification-Version': '1',
                'Implementation-Title': mod_name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': mod_author
        )
    }
}

task verifyReleaseJar(dependsOn: 'reobfJar') {
    group = 'verification'
    description = 'Verifies that the reobfuscated release jar contains EMC integrations but no development or third-party classes.'
    doLast {
        def archive = jar.archivePath
        if (!archive.isFile()) {
            throw new GradleException("Release jar is missing: ${archive}")
        }
        def zip = new java.util.zip.ZipFile(archive)
        try {
            def entries = [] as Set
            zip.entries().each { entries.add(it.name) }
            def required = [
                    'mcmod.info',
                    'cn/gbk/emcfluid/EmcFluid.class',
                    'cn/gbk/emcfluid/integration/rs/EmcCrafterRsIntegration.class',
                    'cn/gbk/emcfluid/integration/ae2/EmcCrafterAe2Integration.class',
                    'cn/gbk/emcfluid/integration/jei/EmcFluidJeiPlugin.class'
            ]
            def missing = required.findAll { !entries.contains(it) }
            def forbiddenPrefixes = [
                    'cn/gbk/emcfluid/dev/',
                    'appeng/',
                    'xyz/phanta/',
                    'com/raoulvdberge/',
                    'mezz/jei/',
                    'moze_intel/projecte/'
            ]
            def forbidden = entries.findAll { name ->
                name == 'META-INF/emcfluid_dev_at.cfg' ||
                        forbiddenPrefixes.any { prefix -> name.startsWith(prefix) }
            }
            if (!missing.isEmpty() || !forbidden.isEmpty()) {
                throw new GradleException("Release jar isolation failed; missing=${missing}, forbidden=${forbidden}")
            }
            def metadata = zip.getInputStream(zip.getEntry('mcmod.info')).getText('UTF-8')
            if (metadata.contains('${version}') || metadata.contains('${mcversion}')) {
                throw new GradleException('mcmod.info still contains unexpanded placeholders')
            }
        } finally {
            zip.close()
        }
    }
}

check.dependsOn verifyReleaseJar

task verifyLocalDependencies {
    group = 'verification'
    description = 'Checks that every fixed 1.12.2 development dependency is present.'
    doLast {
        def requiredFiles = [
                'ProjectE-1.12.2-PE1.4.1.jar',
                'refinedstorage-1.6.16.jar',
                'appliedenergistics2-rv6-stable-7.jar',
                'ae2fc-1.12.2-1.0.11.jar',
                'jei_1.12.2-4.16.5.1029-api.jar',
                'jei_1.12.2-4.16.5.1029.jar'
        ]
        def missing = requiredFiles.findAll { !file("reference/${it}").isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing fixed local dependencies: ${missing.join(', ')}")
        }
    }
}

compileJava.dependsOn verifyLocalDependencies

// ForgeGradle 3 prepares the mapped workspace lazily. Keep the historical task
// name as a reproducible stage-A gate required by the development plan.
task setupDecompWorkspace(dependsOn: [verifyLocalDependencies, compileJava]) {
    group = 'forgegradle'
    description = 'Resolves the Forge 1.12.2 userdev3 workspace and compiles the bootstrap.'
}

build.dependsOn verifyLocalDependencies
jar.finalizedBy 'reobfJar'

task stageJeiRunMod(type: Copy) {
    group = 'verification'
    description = 'Stages the fixed JEI jar in the client mods directory so its access transformer loads early.'
    from 'reference/jei_1.12.2-4.16.5.1029.jar'
    into 'run-client/mods'
    onlyIf { project.hasProperty('withJei') }
}

task stageJeiServerRunMod(type: Copy) {
    group = 'verification'
    description = 'Stages the fixed JEI jar for the full dedicated-server compatibility matrix.'
    from 'reference/jei_1.12.2-4.16.5.1029.jar'
    into 'run-server/mods'
    onlyIf { project.hasProperty('withJei') }
}

task cleanJeiRunMod(type: Delete) {
    group = 'verification'
    description = 'Removes the staged JEI test jar from the client mods directory.'
    delete 'run-client/mods/jei_1.12.2-4.16.5.1029.jar'
    delete 'run-server/mods/jei_1.12.2-4.16.5.1029.jar'
}

task stageAe2FcRunMods(type: Copy) {
    group = 'verification'
    description = 'Stages the fixed AE2 and AE2 Fluid Crafting jars for client compatibility testing.'
    from 'reference/appliedenergistics2-rv6-stable-7.jar'
    from 'reference/ae2fc-1.12.2-1.0.11.jar'
    into 'run-client/mods'
    onlyIf { project.hasProperty('withAe2Fc') }
}

task stageAe2FcServerRunMods(type: Copy) {
    group = 'verification'
    description = 'Stages the fixed AE2 and AE2 Fluid Crafting jars for dedicated-server integration testing.'
    from 'reference/appliedenergistics2-rv6-stable-7.jar'
    from 'reference/ae2fc-1.12.2-1.0.11.jar'
    into 'run-server/mods'
    onlyIf { project.hasProperty('withAe2Fc') }
}

task stageAe2OnlyRunMods(type: Copy) {
    group = 'verification'
    description = 'Stages AE2 without AE2 Fluid Crafting to verify optional-integration degradation.'
    from 'reference/appliedenergistics2-rv6-stable-7.jar'
    into 'run-client/mods'
    onlyIf { project.hasProperty('withAe2') }
}

task stageAe2OnlyServerRunMods(type: Copy) {
    group = 'verification'
    description = 'Stages AE2 without AE2 Fluid Crafting for dedicated-server degradation testing.'
    from 'reference/appliedenergistics2-rv6-stable-7.jar'
    into 'run-server/mods'
    onlyIf { project.hasProperty('withAe2') }
}

task cleanAe2FcRunMods(type: Delete) {
    group = 'verification'
    description = 'Removes staged AE2 and AE2 Fluid Crafting test jars from the client mods directory.'
    delete 'run-client/mods/appliedenergistics2-rv6-stable-7.jar'
    delete 'run-client/mods/ae2fc-1.12.2-1.0.11.jar'
    delete 'run-server/mods/appliedenergistics2-rv6-stable-7.jar'
    delete 'run-server/mods/ae2fc-1.12.2-1.0.11.jar'
}

task stageRsRunMods(type: Copy) {
    group = 'verification'
    description = 'Stages the fixed Refined Storage jar for client and server integration testing.'
    from 'reference/refinedstorage-1.6.16.jar'
    into 'run-client/mods'
    onlyIf { project.hasProperty('withRs') }
}

task stageRsServerRunMod(type: Copy) {
    group = 'verification'
    description = 'Stages the fixed Refined Storage jar in the dedicated-server test directory.'
    from 'reference/refinedstorage-1.6.16.jar'
    into 'run-server/mods'
    onlyIf { project.hasProperty('withRs') }
}

task cleanRsRunMods(type: Delete) {
    group = 'verification'
    description = 'Removes staged Refined Storage test jars.'
    delete 'run-client/mods/refinedstorage-1.6.16.jar'
    delete 'run-server/mods/refinedstorage-1.6.16.jar'
}

tasks.matching { it.name == 'runClient' }.all {
    dependsOn stageJeiRunMod
    dependsOn stageAe2FcRunMods
    dependsOn stageAe2OnlyRunMods
    dependsOn stageRsRunMods
}

tasks.matching { it.name == 'runServer' }.all {
    dependsOn stageJeiServerRunMod
    dependsOn stageAe2FcServerRunMods
    dependsOn stageAe2OnlyServerRunMods
    dependsOn stageRsServerRunMod
}
